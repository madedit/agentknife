# Single source of truth for pinned versions (AGENTS.md §2).
# `cargo xtask ci` verifies Cargo.toml, rust-toolchain.toml, templates/, knowledge/
# and vendored hashes against this file. Upgrade everything derived from it in one change.

[rust]
toolchain = "1.99.1"

[crates]
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-cli = "2.12.3"
leptos = "0.8.22"
# wasm-bindgen crate and wasm-bindgen-cli must match exactly.
wasm-bindgen = "0.2.129"

[tools]
trunk = "0.21.14"
tailwind-cli = "4.3.3"

# npm packages vendored by `cargo xtask vendor-codemirror` (no Node; fetched from esm.sh).
[vendor.codemirror]
"codemirror" = "6.0.2"
"@codemirror/state" = "6.7.6"
"@codemirror/view" = "6.43.15"
"@codemirror/language" = "6.13.1"
"@codemirror/commands" = "6.11.1"
"@codemirror/autocomplete" = "6.20.4"
"@codemirror/lint" = "6.9.7"
"@codemirror/search" = "6.7.2"
"@codemirror/lang-rust" = "6.0.2"
"@codemirror/lang-css" = "6.3.1"
"@codemirror/lang-html" = "6.4.12"
"@codemirror/lang-markdown" = "6.5.2"
"@codemirror/legacy-modes" = "6.5.5"
"@codemirror/theme-one-dark" = "6.1.3"
"@lezer/common" = "1.5.3"
"@lezer/highlight" = "1.2.5"
"@lezer/lr" = "1.4.11"

[knowledge]
pack = "0.1.0"
