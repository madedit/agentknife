# Docs the agent reads with `read_knowledge(topic)`. They describe exactly the
# versions below; `cargo xtask ci` checks them against versions.toml.
[pack]
id = "tauri-leptos"
version = "0.2.22"

[versions]
tauri = "2.12.4"
tauri-cli = "2.12.3"
leptos = "0.8.22"
wasm-bindgen = "0.2.129"
trunk = "0.21.14"
tailwind-cli = "4.3.3"

[[topic]]
id = "overview"
title = "Project layout and workflow"
summary = "Where the screens, the backend and the styles live; the user's own files in assets/ (never downloaded; no 3D model loading yet); how the preview runs; rules for every change; crates that are not here and what to use instead."
file = "overview.md"

[[topic]]
id = "leptos-components"
title = "Leptos components and view!"
summary = "Components, props (into, no .into()), children, the view! macro, events and their types, keys for the whole window (games), attributes, classes (Tailwind arbitrary values), Show/For (each, key), menus that close on a click outside, if/else views."
file = "leptos-components.md"

[[topic]]
id = "leptos-reactivity"
title = "Signals and async in Leptos"
summary = "RwSignal, derived values, Memo, Effect, context, spawn_local, LocalResource, timers (set_interval_with_handle), game state in one signal (try_update), avoiding move/Send errors."
file = "leptos-reactivity.md"

[[topic]]
id = "forms"
title = "Inputs and forms"
summary = "Binding text, numbers, checkboxes and selects to signals; submitting forms; validation messages."
file = "forms.md"

[[topic]]
id = "browser"
title = "Browser features (web-sys)"
summary = "Clipboard, focus, the input behind an event, promises: adding web-sys with the right features, dyn_into, JsFuture."
file = "browser.md"

[[topic]]
id = "canvas"
title = "Canvas editors"
summary = "Flow charts, diagrams, maps: a stage with pointer capture, pan and zoom with one transform, screen to drawing coordinates, wheel zoom with a non-passive listener, SVG lines with a wide hit path, fit-zoom limits, shortcut keys that skip fields; big grids drawn on a <canvas> (2D context, only the visible rows, scrolling)."
file = "canvas.md"

[[topic]]
id = "drag-drop"
title = "Drag and drop"
summary = "Dragging cards between columns or sorting a list: Tauri's dragDropEnabled on Windows, the web-sys features, dragstart/dragover/drop, moving only on drop, a way without dragging, checking with interact drag."
file = "drag-drop.md"

[[topic]]
id = "network"
title = "Data from the internet"
summary = "Trying a service with curl first, fetch from the screens with a time limit (web-sys features, AbortController), CORS, encoding user text in URLs."
file = "network.md"

[[topic]]
id = "rich-text"
title = "Text editors (formatting, find and replace)"
summary = "contenteditable with NodeRef, execCommand (bold, colours) without losing focus, toolbar state, saving HTML, finding text safely in non-ASCII text."
file = "rich-text.md"

[[topic]]
id = "date-time"
title = "Dates and times"
summary = "Today's date and months in the screens (js_sys::Date, no SystemTime) and the backend (chrono); dates kept as YYYY-MM-DD text."
file = "date-time.md"

[[topic]]
id = "tauri-commands"
title = "Tauri backend commands"
summary = "#[tauri::command], argument names, State, async commands, errors, files in the app data folder."
file = "tauri-commands.md"

[[topic]]
id = "storage"
title = "Saving data"
summary = "Keeping the app's data between runs: a JSON file in the app data folder (recommended) or localStorage; exporting a CSV file for Excel (BOM, safe file names)."
file = "storage.md"

[[topic]]
id = "import-backup"
title = "Importing, backups, moving computers"
summary = "Importing CSV from Excel (UTF-8 and Big5, quoted cells, header names, numbers and dates, a summary before adding), .xlsx via CSV UTF-8, backing up and restoring the data file safely, moving to another computer."
file = "import-backup.md"

[[topic]]
id = "reports"
title = "Charts, printing and PDF"
summary = "Bar, pie and line charts in SVG without a library, totals in a Memo, printing with window.print and print: classes, PDF through Microsoft Print to PDF, saving a chart as an SVG picture."
file = "reports.md"

[[topic]]
id = "long-lists"
title = "Long lists: search, sort and pages"
summary = "Thousands of rows: filter and sort once in a Memo, one page at a time, numbers sorted as numbers, resetting the page, testing with many rows."
file = "long-lists.md"

[[topic]]
id = "undo-autosave"
title = "Undo, redo and saving by itself"
summary = "A history of copies for Ctrl+Z / Ctrl+Y, typing and dragging as one step, the shortcut keys, saving after a pause (dirty, Saving…/Saved), drafts kept in localStorage."
file = "undo-autosave.md"

[[topic]]
id = "desktop"
title = "Windows features (notifications, tray, autostart, logs)"
summary = "Notifications (plugin), a tray icon that keeps the app running, hiding on close, starting with Windows (plugin, not in the preview), a second window, a log file with crashes, why no signing or updater."
file = "desktop.md"

[[topic]]
id = "images-dialogs"
title = "Pictures and the system dialogs (backend)"
summary = "Thumbnails with the image crate (thumbnail, write_to, data URLs for <img>), choosing a folder or file with the dialog plugin (set_title, FilePath)."
file = "images-dialogs.md"

[[topic]]
id = "ak-bridge"
title = "Calling the backend (ak_bridge::invoke)"
summary = "invoke with typed arguments and results, error handling, start(), set_state_reader, set_hit_test."
file = "ak-bridge.md"

[[topic]]
id = "ak-ui"
title = "ak-ui components"
summary = "Button, Input, Form, List, Dialog, Nav, Card, Toggle, Toast: props and examples."
file = "ak-ui.md"

[[topic]]
id = "data-ak-id"
title = "The data-ak-id convention"
summary = "Which elements need ids, how to name them, ids for list rows and component parts."
file = "data-ak-id.md"

[[topic]]
id = "tailwind"
title = "Styling with Tailwind CSS 4"
summary = "Utility classes, layout, colors, dark mode, responsive design, why class names must be written out in full, and usable with the keyboard and easy to read (buttons, focus, labels, contrast)."
file = "tailwind.md"

[[topic]]
id = "example-todo"
title = "Complete example: a to-do app"
summary = "A whole app: add, check and delete items, saved to a file by the backend. Copy and adapt."
file = "example-todo.md"

[[topic]]
id = "three-d"
title = "3D games and scenes (three.js)"
summary = "3D graphics with three.js on a <canvas>: add_library, index.html, a game.js module called from Rust (matching names), state for dom_summary, planning game states, input (preventDefault for every game key), the view (OrbitControls zoom, buttons that turn the view), board games (busy state, playable boards, a hint to test with), the canvas height, cleanup, shooters (aiming, fast bullets, enemies), testing a running game."
file = "three-d.md"

[[topic]]
id = "troubleshooting"
title = "Fixing common build errors"
summary = "What the usual Rust, Leptos, Tauri and Trunk errors mean and how to fix them."
file = "troubleshooting.md"

# JS libraries `add_library` can copy into a project (vendored by
# `cargo xtask vendor-libs`; versions in versions.toml [vendor.libraries]).
[[library]]
id = "three"
version = "0.186.1"
summary = "three.js 3D graphics (WebGL) for games and 3D scenes. Read topic `three-d` for the setup."
setup = """
1. index.html: right after <title>, before the other trunk links (keep those as they are):
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <link data-trunk rel="copy-dir" href="vendor" />
   Keep the "/" at the end of both "three/addons/" paths: without it the page stays blank while the build says ok.
2. Cargo.toml (screens), [dependencies]:
    serde_json = "1.0.154"
    web-sys = { version = "0.3.106", features = ["HtmlCanvasElement"] }
   (if web-sys is there already, add "HtmlCanvasElement" to its features)
3. Read topic three-d before writing src/game.js.
"""
dir = "libraries/three"
target = "vendor/three"
