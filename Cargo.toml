[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
ak-types = { path = "crates/ak-types" }
ak-providers = { path = "crates/ak-providers" }

# Pinned stack — must match versions.toml exactly (checked by `cargo xtask ci`).
tauri = "=2.12.4"
tauri-build = "=2.7.3"
# Tauri plugins used by ak-app (2.x line, compatible with the pinned tauri).
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
leptos = "=0.8.22"
wasm-bindgen = "=0.2.129"
# MCP server for agent CLIs (ak-mcp).
rmcp = { version = "=3.7.0", default-features = false }

# Common
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = "1.54.0"
tokio-util = "0.7.20"
futures-util = "0.3.34"
encoding_rs = "0.8.42"
reqwest = { version = "0.13.5", features = ["stream"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
sys-locale = "0.3.2"
unic-langid = "0.9.6"
gix = { version = "0.89.0", default-features = false, features = ["sha1"] }
keyring = "4.2.0"
toml = "1.1.8"
sha2 = "0.11.1"
tempfile = "3.27.0"
regex = "1.13.1"
ignore = "0.4.33"
dirs = "7.0.0"
trash = "5.2.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1.10"
tar = "0.4.46"
tokio-tungstenite = "0.30.0"
js-sys = "0.3.106"
web-sys = "0.3.106"
wasm-bindgen-futures = "0.4.79"
futures-channel = "0.3.34"
getrandom = "0.3.4"
syn = { version = "3.0.9", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
rstml = { version = "0.13.1", default-features = false }

[workspace.lints.clippy]
# AGENTS.md §5: unwrap() is banned outside tests (see clippy.toml).
unwrap_used = "deny"
