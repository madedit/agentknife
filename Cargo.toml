[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
ak-types = { path = "crates/ak-types" }
ak-providers = { path = "crates/ak-providers" }

# Pinned stack — must match versions.toml exactly (checked by `cargo xtask ci`).
tauri = "=2.12.4"
tauri-build = "=2.7.3"
leptos = "=0.8.22"
wasm-bindgen = "=0.2.129"

# Common
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = "1.54.0"
tokio-util = "0.7.20"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["stream"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
sys-locale = "0.3.2"
unic-langid = "0.9.6"
gix = "0.89.0"
keyring = "4.2.0"
toml = "1.1.8"
sha2 = "0.11.1"
tempfile = "3.27.0"
regex = "1.13.1"
ureq = "3.4.2"

[workspace.lints.clippy]
# AGENTS.md §5: unwrap() is banned outside tests (see clippy.toml).
unwrap_used = "deny"
