# Copied from crates/ak-bridge by `cargo xtask vendor-kit`. Do not edit here:
# change the original and re-run it. AgentKnife refreshes this folder.

[package]
build = false
edition = "2024"
license = "MIT OR Apache-2.0"
name = "ak-bridge"
publish = false
version = "0.1.0"

[features]
dev = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:futures-channel"]

[dependencies.serde]
features = ["derive"]
version = "1.0.229"

[dependencies.serde_json]
version = "1.0.154"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.futures-util]
optional = true
version = "0.3.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tauri]
version = "=2.12.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
features = ["net", "sync", "rt", "macros"]
optional = true
version = "1.54.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio-tungstenite]
optional = true
version = "0.30.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.futures-channel]
optional = true
version = "0.3.34"

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3.106"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4.79"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
features = ["Window", "console", "Location", "Storage", "UrlSearchParams", "WebSocket", "MessageEvent", "CloseEvent", "Event", "EventTarget", "AddEventListenerOptions", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlCollection", "CssStyleDeclaration", "DomRect", "MouseEvent", "MouseEventInit", "PointerEvent", "PointerEventInit", "KeyboardEvent", "KeyboardEventInit", "EventInit", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlFormElement", "Node", "NodeList", "DomRectList"]
version = "0.3.106"
