[package]
name = "app-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ak-bridge = { path = "ak/ak-bridge" }
ak-ui = { path = "ak/ak-ui" }
leptos = { version = "=0.8.22", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
wasm-bindgen = "=0.2.129"

[features]
# AgentKnife's preview only: bridge, inspector and control channel.
# Release builds never enable it.
dev = ["ak-bridge/dev"]

[workspace]
members = ["src-tauri"]
resolver = "3"

# Debug builds (preview, real-window run) keep only line numbers for the app's
# own code and no debug info for libraries: the first build is about a quarter
# faster and target/ about 40% smaller. Release builds are not affected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
