# Built by AgentKnife's own toolchain (pinned versions, nothing downloaded).
[build]
target = "index.html"

[watch]
# Only what the screens are built from. Anything else (the backend, which has its
# own build; AgentKnife's .agentknife/ notes and turn lock; docs) must not
# rebuild and reload the preview page while the agent works.
watch = ["index.html", "Cargo.toml", "src", "style", "ak"]

[serve]
addresses = ["127.0.0.1"]
port = 1420
open = false

[tools]
wasm_bindgen = "0.2.129"
tailwindcss = "4.3.3"
