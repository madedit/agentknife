name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      # rust-toolchain.toml pins the version, components and wasm target.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2

      # Only crates are downloaded. `cargo xtask ci` itself never fetches anything.
      - name: cargo xtask ci
        run: cargo xtask ci
