name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      # rust-toolchain.toml pins the version, components and wasm target.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2

      # What Tauri needs on Linux (AgentKnife and the generated apps).
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Only crates are downloaded. `cargo xtask ci` itself never fetches anything.
      - name: cargo xtask ci
        run: cargo xtask ci

  # P1-E2E-001: the scripted first-use story, building and packaging a real
  # app. AgentKnife's toolchain is cached; only a cache miss downloads it
  # (through doctor_install, AK_E2E_PROVISION=1).
  e2e:
    name: xtask e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2

      # What Tauri needs on Linux, and a virtual screen for the generated app.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: AgentKnife toolchain cache
        uses: actions/cache@v4.2.3
        with:
          path: ${{ runner.temp }}/ak-toolchain
          key: ak-toolchain-${{ runner.os }}-${{ hashFiles('versions.toml') }}

      - name: cargo xtask e2e
        shell: bash
        # The generated app opens a window: on Linux there is no screen
        # without xvfb ("Failed to initialize GTK").
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo xtask e2e
          else
            cargo xtask e2e
          fi
        env:
          AK_E2E_TOOLCHAIN: ${{ runner.temp }}/ak-toolchain
          AK_E2E_PROVISION: "1"
