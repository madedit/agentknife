[package]
name = "ak-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ak-preview = { path = "../ak-preview" }
ak-project = { path = "../ak-project" }
ak-types.workspace = true
flate2.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "rt", "sync", "macros"] }
tokio-util.workspace = true
zip.workspace = true

[[bin]]
# Test helper: imitates `cargo tauri build` (tests/bundle.rs).
name = "ak-bundle-fake-build"
path = "src/bin/fake_build.rs"
test = false
doc = false

[dev-dependencies]
ak-doctor = { path = "../ak-doctor" }
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "rt", "rt-multi-thread", "sync", "macros", "time"] }

[lints]
workspace = true
