[package]
name = "ak-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AgentKnife's own UI (Leptos). `trunk serve` in this folder runs it in a browser."

[dependencies]
ak-types.workspace = true
futures-channel.workspace = true
js-sys.workspace = true
leptos.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "Clipboard",
    "DataTransfer",
    "DomRect",
    "DragEvent",
    "Element",
    "File",
    "FileList",
    "HtmlIFrameElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "ResizeObserver",
    "Storage",
    "Window",
] }

[features]
# The browser build (index.html enables it); native tests render with `ssr`.
csr = ["leptos/csr"]

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[lints]
workspace = true
