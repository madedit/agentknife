[package]
name = "ak-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Preview builds only. Release builds leave it off, which removes the WebSocket
# server, the WebSocket client and their dependencies (checked by `cargo xtask ci`).
dev = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:futures-channel",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauri.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "sync", "rt", "macros"] }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
futures-channel = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
    "Window",
    "Location",
    "Storage",
    "UrlSearchParams",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlCollection",
    "CssStyleDeclaration",
    "DomRect",
    "MouseEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "EventInit",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlFormElement",
    "Node",
    "NodeList",
    "DomRectList",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["net", "sync", "rt", "rt-multi-thread", "macros", "time"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true
